---
apache::default_vhost: false
redis::bind: '127.0.0.1'

foreman::repo::repo: '2.5'
katello::repo::repo_version: '4.1'
candlepin::repo::version: '4.1'

foreman::version: latest
foreman::plugin_version: latest

foreman::initial_admin_password: changeme
foreman::db_password: changeme

foreman::cli::version: latest
foreman::cli::plugin::version: latest

foreman_proxy::version: latest
foreman_proxy::plugin::version: latest

certs::group: foreman

foreman::client_ssl_ca: /etc/foreman/proxy_ca.pem
foreman::client_ssl_cert: /etc/foreman/client_cert.pem
foreman::client_ssl_key: /etc/foreman/client_key.pem

#foreman::initial_location: Default Location
#foreman::initial_organization: Default Organization

foreman::server_ssl_ca: /etc/pki/katello/certs/katello-default-ca.crt
foreman::server_ssl_cert: /etc/pki/katello/certs/katello-apache.crt
foreman::server_ssl_chain: /etc/pki/katello/certs/katello-server-ca.crt
foreman::server_ssl_crl: ""
foreman::server_ssl_key: /etc/pki/katello/private/katello-apache.key

foreman_proxy::bmc: true
foreman_proxy::dhcp: true
foreman_proxy::dns: true
foreman_proxy::tftp: true

foreman_proxy::plugin::discovery::install_images: true

foreman_proxy::foreman_ssl_ca: /etc/foreman-proxy/foreman_ssl_ca.pem
foreman_proxy::foreman_ssl_cert: /etc/foreman-proxy/foreman_ssl_cert.pem
foreman_proxy::foreman_ssl_key: /etc/foreman-proxy/foreman_ssl_key.pem

foreman_proxy::ssl_ca: /etc/foreman-proxy/ssl_ca.pem
foreman_proxy::ssl_cert: /etc/foreman-proxy/ssl_cert.pem
foreman_proxy::ssl_key: /etc/foreman-proxy/ssl_key.pem
foreman_proxy::ssl_port: 9090

dhcp::hosts:
  messy-maas:
    mac: '38:ea:a7:13:84:3c'
    ip: '192.168.3.1'
  cool-gator:
    mac: 'c4:34:6b:b5:ad:80'
    ip: '192.168.3.2'
  key-shrimp:
    mac: 'c4:34:6b:b5:ad:4c'
    ip: '192.168.3.3'
  mint-panda:
    mac: 'c4:34:6b:b6:a1:e0'
    ip: '192.168.3.4'
  novel-dodo:
    mac: 'c4:34:6b:ad:74:a0'
    ip: '192.168.3.5'
  famous-koi:
    mac: 'b8:ca:3a:5f:1d:00'
    ip: '192.168.3.6'
  grand-worm:
    mac: 'b8:ca:3a:5e:8f:20'
    ip: '192.168.3.7'

profile::foreman::settings:
  # General
  entries_per_page:
    value: 100
  #Provisioning
  default_pxe_item_global:
    value: discovery
  destroy_vm_on_host_delete:
    value: true
  use_shortname_for_vms:
    value: true
  #Puppet
  create_new_host_when_facts_are_uploaded:
    value: false
  create_new_host_when_report_is_uploaded:
    value: false
  default_location:
    value: 'Default Location'
  default_organization:
    value: 'Default Organization'
  #Authentication
  idle_timeout:
    value: 180

puppet::server: true
puppet::server_external_nodes: ''
puppet::server_common_modules_path: ''
puppet::server_environments_recurse: true

puppet::server::foreman::katello: true

puppet::foreman_ssl_ca: /etc/pki/katello/puppet/puppet_client_ca.crt
puppet::foreman_ssl_cert: /etc/pki/katello/puppet/puppet_client.crt
puppet::foreman_ssl_key: /etc/pki/katello/puppet/puppet_client.key

r10k::remote: "https://github.com/eb4x/hav.git"

profile::virtualization::libvirt::networks:
  default:
    ensure: absent
  provision:
    ensure: enabled
    autostart: true
    forward_mode: bridge
    bridge: br-provision
  openstack:
    ensure: enabled
    autostart: true
    forward_mode: bridge
    bridge: br-openstack
